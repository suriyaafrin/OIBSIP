<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="card">

    <header class="app-header">
      <h1>Todo List</h1>
      <p class="subtitle">Simple, fully functional, saved right here in your browser.</p>
    </header>

    <form id="add-form" class="entry-form" autocomplete="off">
      <label for="task-input" class="sr-only">New task</label>
      <input id="task-input" type="text" placeholder="Add a task…" maxlength="200">
      <button type="submit">Add</button>
    </form>

    <section class="task-section" aria-labelledby="pending-heading">
      <div class="section-head">
        <h2 id="pending-heading">To do</h2>
        <span class="count" id="pending-count">0</span>
      </div>
      <ul id="pending-list" class="task-list"></ul>
      <p id="pending-empty" class="empty-state hidden">Nothing to do. Add a task above.</p>
    </section>

    <section class="task-section" aria-labelledby="done-heading">
      <div class="section-head">
        <h2 id="done-heading">Done</h2>
        <span class="count" id="done-count">0</span>
      </div>
      <ul id="done-list" class="task-list"></ul>
      <p id="done-empty" class="empty-state hidden">Nothing finished yet.</p>
    </section>

    <footer class="app-footer">
      <p>Saved locally in this browser.</p>
      <button id="clear-done" type="button" class="text-btn clear-btn hidden">Clear done</button>
    </footer>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
