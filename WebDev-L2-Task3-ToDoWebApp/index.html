<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — a daily task ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ledger-page">

  <header class="ledger-header">
    <p class="eyebrow">Task Ledger · Entry No. <span id="ledger-number">001</span></p>
    <h1>Ledger</h1>
    <p class="subtitle">Write it down. Stamp it when it's settled.</p>
  </header>

  <form id="add-form" class="entry-form" autocomplete="off">
    <label for="task-input" class="sr-only">New entry</label>
    <input id="task-input" type="text" placeholder="What needs doing?" maxlength="200">
    <button type="submit">
      <span>Add entry</span>
    </button>
  </form>

  <section class="ledger-section" aria-labelledby="open-heading">
    <div class="section-head">
      <h2 id="open-heading">Open</h2>
      <span class="count" id="open-count">0</span>
    </div>
    <ol id="open-list" class="entry-list"></ol>
    <p id="open-empty" class="empty-state hidden">No open entries. Add your first one above.</p>
  </section>

  <section class="ledger-section" aria-labelledby="settled-heading">
    <div class="section-head">
      <h2 id="settled-heading">Settled</h2>
      <span class="count" id="settled-count">0</span>
    </div>
    <ol id="settled-list" class="entry-list"></ol>
    <p id="settled-empty" class="empty-state hidden">Nothing settled yet.</p>
  </section>

  <footer class="ledger-footer">
    <p>Entries are saved in this browser only.</p>
    <button id="clear-settled" type="button" class="text-btn hidden">Clear settled entries</button>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
